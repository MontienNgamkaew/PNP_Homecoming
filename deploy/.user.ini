; Requests carry base64 JSON, so permit the 5 MiB file plus encoding overhead.
post_max_size = 8M
upload_max_filesize = 5M
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
display_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
